name: Validate package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: mkdir -p artifacts && npm pack --ignore-scripts --pack-destination artifacts
      - run: npm ci --prefix examples/minimal-next
      - run: npm run build --prefix examples/minimal-next
